<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Book Club Schedule</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f7f7f5; color: #1a1a1a; min-height: 100vh; }
  .app { max-width: 680px; margin: 0 auto; padding: 2.5rem 1.25rem; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
  .meta { font-size: 13px; color: #888; margin-bottom: 1.75rem; }
  .table-wrap { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 12px; overflow: hidden; margin-bottom: 1.25rem; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { background: #f7f7f5; color: #666; font-weight: 500; font-size: 13px; padding: 11px 14px; text-align: left; border-bottom: 0.5px solid #e5e5e5; }
  td { padding: 11px 14px; border-bottom: 0.5px solid #e5e5e5; color: #1a1a1a; }
  tr:last-child td { border-bottom: none; }
  tr:nth-child(even) td { background: #fafaf8; }
  .footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .updated { font-size: 12px; color: #aaa; }
  .btn-print { font-size: 13px; padding: 8px 18px; border-radius: 8px; border: 0.5px solid #ccc; background: #fff; color: #1a1a1a; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn-print:hover { background: #f0f0ee; }
  .btn-print:active { transform: scale(0.98); }
  .loading { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }
  .error { text-align: center; padding: 40px; color: #c0392b; font-size: 14px; }
  @media (max-width: 480px) { th, td { padding: 9px 10px; font-size: 14px; } }
</style>
</head>
<body>
<div class="app">
  <h1>📚 Book Club Schedule</h1>
  <p class="meta" id="meta">Loading schedule…</p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Date</th><th>Host</th><th>Book</th><th>Leader</th></tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="4" class="loading">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="footer">
    <span class="updated" id="updated"></span>
    <button class="btn-print" onclick="downloadForPrinting()">🖨 Download for printing</button>
  </div>
</div>

<script>
  // ── CONFIGURATION ──────────────────────────────────────────────────────────
  // Replace these two values before uploading to GitHub Pages.
  const JSONBIN_BIN_ID  = 'YOUR_BIN_ID_HERE';
  const JSONBIN_API_KEY = '$2a$10$ihQz8S8Ud.ak0XSZWGGHiuNK78rse4XpeF06lZNhT0ii6ydG9hNDe';
  // ──────────────────────────────────────────────────────────────────────────

  let rows = [];

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function loadSchedule() {
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
        headers: { 'X-Master-Key': JSONBIN_API_KEY }
      });
      if (!res.ok) throw new Error('Could not load schedule (status ' + res.status + ')');
      const data = await res.json();
      rows = data.record.rows || [];

      const updatedAt = data.record.updatedAt
        ? new Date(data.record.updatedAt).toLocaleString('en-CA', { dateStyle: 'medium', timeStyle: 'short' })
        : null;

      render(updatedAt);
    } catch (e) {
      document.getElementById('tbody').innerHTML =
        `<tr><td colspan="4" class="error">Could not load schedule. Please try again later.</td></tr>`;
      document.getElementById('meta').textContent = '';
    }
  }

  function render(updatedAt) {
    const tbody = document.getElementById('tbody');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:#aaa;padding:32px">No upcoming meetings scheduled.</td></tr>`;
    } else {
      tbody.innerHTML = rows.map(r =>
        `<tr><td>${esc(r.date)}</td><td>${esc(r.host)}</td><td>${esc(r.book)}</td><td>${esc(r.leader)}</td></tr>`
      ).join('');
    }
    document.getElementById('meta').textContent =
      rows.length + ' meeting' + (rows.length !== 1 ? 's' : '') + ' scheduled';
    document.getElementById('updated').textContent =
      updatedAt ? 'Last updated: ' + updatedAt : '';
  }

  function downloadForPrinting() {
    const today = new Date().toLocaleDateString('en-CA');
    const trs = rows.map(r =>
      `<tr><td>${esc(r.date)}</td><td>${esc(r.host)}</td><td>${esc(r.book)}</td><td>${esc(r.leader)}</td></tr>`
    ).join('');
    const html = `<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Book Club Schedule</title>
<style>
  body { font-family: Georgia, serif; padding: 2rem; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 1.5rem; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { background: #f4f4f2; padding: 10px 12px; text-align: left; border: 1px solid #ddd; font-weight: 600; }
  td { padding: 9px 12px; border: 1px solid #ddd; }
  tr:nth-child(even) td { background: #fafaf8; }
  @media print { body { padding: 0; } }
</style></head><body>
<h1>Book Club Schedule</h1>
<p class="sub">Downloaded ${today}</p>
<table><thead><tr><th>Date</th><th>Host</th><th>Book</th><th>Leader</th></tr></thead>
<tbody>${trs}</tbody></table>
</body></html>`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    a.download = `book-club-schedule-${today}.html`;
    a.click();
  }

  loadSchedule();
</script>
</body>
</html>
