<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Book Club Schedule</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/tabler-icons.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f7f7f5; color: #1a1a1a; min-height: 100vh; }
  .app { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.25rem; }
  h1 { font-size: 22px; font-weight: 500; }
  .meta { font-size: 13px; color: #999; margin-bottom: 1.5rem; min-height: 1.2em; }
  .btn { font-size: 13px; padding: 6px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fff; color: #1a1a1a; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background 0.12s; }
  .btn:hover { background: #f0f0ee; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: #dbeafe; color: #1d4ed8; border-color: transparent; }
  .btn-primary:hover { background: #bfdbfe; }
  .btn-danger { background: #fee2e2; color: #b91c1c; border-color: transparent; }
  .btn-danger:hover { background: #fecaca; }
  .btn-success { background: #dcfce7; color: #166534; border-color: transparent; }
  .btn-success:hover { background: #bbf7d0; }
  .btn-admin { font-size: 11px; padding: 3px 10px; border-radius: 6px; background: transparent; border: 0.5px solid #ddd; color: #bbb; cursor: pointer; }
  .btn-admin:hover { color: #888; border-color: #bbb; }
  .panel { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; }
  .panel h3 { font-size: 14px; font-weight: 500; margin-bottom: 14px; }
  .sf { display: flex; flex-direction: column; gap: 4px; margin-bottom: 11px; }
  .sf label { font-size: 12px; color: #666; }
  .sf input { font-size: 13px; border: 0.5px solid #ccc; border-radius: 7px; padding: 7px 10px; background: #fff; color: #1a1a1a; }
  .sf input:focus { outline: 2px solid #93c5fd; border-color: transparent; }
  .hint { font-size: 11px; color: #aaa; margin-top: 2px; }
  .chip { font-size: 12px; padding: 3px 9px; background: #dbeafe; color: #1d4ed8; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; margin: 3px 3px 0 0; }
  .chip:hover { background: #bfdbfe; }

  /* Add row form */
  .add-form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 1rem; padding: 12px; background: #f7f7f5; border-radius: 10px; border: 0.5px solid #e5e5e5; }
  .field { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 85px; }
  .field label { font-size: 11px; color: #666; }
  .field input { font-size: 13px; border: 0.5px solid #ccc; border-radius: 7px; padding: 6px 9px; background: #fff; color: #1a1a1a; }
  .field input:focus { outline: 2px solid #93c5fd; border-color: transparent; }

  /* Table */
  .table-wrap { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 12px; overflow: visible; margin-bottom: 1rem; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; table-layout: fixed; border-radius: 12px; overflow: hidden; }
  th { background: #f7f7f5; color: #666; font-weight: 500; font-size: 13px; padding: 10px 12px; text-align: left; border-bottom: 0.5px solid #e5e5e5; }
  td { padding: 10px 12px; border-bottom: 0.5px solid #e5e5e5; color: #1a1a1a; vertical-align: middle; overflow: visible; }
  tr:last-child td { border-bottom: none; }
  tr.editing-row td { background: #f7f7f5; }
  .cell-display { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td input[type=text] { font-size: 13px; border: 0.5px solid #93c5fd; border-radius: 6px; padding: 4px 8px; background: #fff; color: #1a1a1a; width: 100%; outline: none; }

  /* Footer */
  .footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
  .status { font-size: 12px; color: #999; display: flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot-ok { background: #16a34a; } .dot-busy { background: #d97706; } .dot-err { background: #dc2626; }
  .toast { position: fixed; top: 16px; right: 16px; background: #fff; border: 0.5px solid #ccc; border-radius: 10px; padding: 10px 16px; font-size: 13px; color: #1a1a1a; z-index: 999; max-width: 320px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: none; }
  .badge-admin { font-size: 11px; padding: 2px 8px; border-radius: 5px; background: #dbeafe; color: #1d4ed8; font-weight: 500; margin-left: 8px; }

  /* Calendar — fixed position so it never overlaps siblings */
  .cal-anchor { position: relative; display: inline-block; width: 100%; }
  .cal-popup {
    position: fixed; z-index: 999;
    background: #fff; border: 0.5px solid #ccc; border-radius: 10px;
    padding: 10px; width: 224px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    display: none;
  }
  .cal-popup.open { display: block; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-header span { font-size: 12px; font-weight: 500; }
  .cal-nav { background: none; border: none; cursor: pointer; color: #666; font-size: 16px; padding: 2px 7px; border-radius: 6px; }
  .cal-nav:hover { background: #f0f0ee; }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
  .cal-dow { font-size: 10px; color: #aaa; text-align: center; padding: 2px 0; }
  .cal-day { font-size: 12px; text-align: center; padding: 5px 2px; border-radius: 6px; cursor: pointer; }
  .cal-day:hover { background: #f0f0ee; }
  .cal-day.is-today { font-weight: 600; color: #1d4ed8; }
  .cal-day.is-selected { background: #dbeafe; color: #1d4ed8; }
  .cal-day.empty { cursor: default; }
  .cal-day.empty:hover { background: none; }

  @media (max-width: 500px) { .add-form { flex-direction: column; } .field { min-width: 100%; } }
</style>
</head>
<body>
<div class="app">

  <div class="page-header">
    <h1>📚 Book Club Schedule<span class="badge-admin" id="admin-badge" style="display:none">Admin</span></h1>
    <button class="btn-admin" id="admin-toggle" onclick="toggleAdmin()">Admin</button>
  </div>
  <p class="meta" id="meta"></p>

  <!-- CONFIG PANEL -->
  <div class="panel" id="cfg-panel" style="display:none">
    <h3>⚙️ Configuration</h3>
    <div class="sf">
      <label>JSONBin Master API Key</label>
      <input type="password" id="cfg-key" placeholder="$2a$10$..." />
      <p class="hint">Stored in your browser only.</p>
    </div>
    <div class="sf">
      <label>JSONBin Bin ID</label>
      <input type="text" id="cfg-binid" placeholder="6a1b6290ddf5aa59f779c5ed" />
      <p class="hint">Leave blank to auto-create on first save.</p>
    </div>
    <div class="sf">
      <label>This page's URL (included in notification emails)</label>
      <input type="text" id="cfg-pageurl" placeholder="https://yourusername.github.io/book-club/" />
    </div>
    <div class="sf">
      <label>Recipients — press Enter after each email</label>
      <input type="text" id="cfg-recip-input" placeholder="friend@example.com" onkeydown="handleRecipKey(event)" />
      <div id="recip-wrap" style="margin-top:5px"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-primary" onclick="saveConfig()"><i class="ti ti-check"></i>Save config</button>
      <button class="btn" onclick="document.getElementById('cfg-panel').style.display='none'">Close</button>
    </div>
  </div>

  <!-- ADD ROW FORM -->
  <div id="add-section" style="display:none">
    <div class="add-form">
      <div class="field">
        <label>Date</label>
        <div class="cal-anchor">
          <input type="text" id="new-date" placeholder="Pick a date" readonly onclick="openCal('new-date-cal', this)" />
          <div class="cal-popup" id="new-date-cal"></div>
        </div>
      </div>
      <div class="field"><label>Host</label><input type="text" id="new-host" placeholder="Name" /></div>
      <div class="field"><label>Book</label><input type="text" id="new-book" placeholder="Title" /></div>
      <div class="field"><label>Leader</label><input type="text" id="new-leader" placeholder="Name" /></div>
      <div style="display:flex;gap:6px;margin-top:16px;flex-shrink:0">
        <button class="btn btn-success" onclick="addRow()"><i class="ti ti-plus"></i>Add</button>
        <button class="btn" onclick="cancelAdd()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <colgroup>
        <col style="width:18%"><col style="width:18%"><col style="width:32%"><col style="width:17%">
        <col id="actions-col" style="width:15%;display:none">
      </colgroup>
      <thead>
        <tr>
          <th>Date</th><th>Host</th><th>Book</th><th>Leader</th>
          <th id="actions-th" style="display:none">Actions</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div style="display:flex;flex-direction:column;gap:4px">
      <div class="status"><span class="dot dot-ok" id="sdot"></span><span id="stxt">Loading…</span></div>
      <div style="font-size:12px;color:#bbb" id="updated-label"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="btn" id="cfg-btn" style="display:none" onclick="openConfig()"><i class="ti ti-settings"></i>Configure</button>
      <button class="btn" id="add-btn" style="display:none" onclick="showAdd()"><i class="ti ti-plus"></i>Add row</button>
      <button class="btn btn-primary" id="save-btn" style="display:none" onclick="saveAndNotify()"><i class="ti ti-cloud-upload"></i>Save &amp; notify</button>
      <button class="btn" onclick="downloadForPrinting()"><i class="ti ti-printer"></i>Download for printing</button>
    </div>
  </div>

</div>
<div id="toast" class="toast"></div>

<!-- Hidden calendar portal — rendered here, positioned via JS -->
<div class="cal-popup" id="cal-portal"></div>

<script>
  // ── EmailJS ───────────────────────────────────────────────────────────────
  const EMAILJS_SERVICE_ID  = 'service_qogj6ym';
  const EMAILJS_TEMPLATE_ID = 'template_5k25ppp';
  const EMAILJS_PUBLIC_KEY  = 'g2tRBRSt_6Jf-2V6h';
  emailjs.init(EMAILJS_PUBLIC_KEY);

  // ── JSONBin — BIN ID hardcoded for viewer reads (no API key needed for public read) ──
  // Admin sets their key via Configure; viewers load via the public read URL below.
  const PUBLIC_BIN_ID = '6a1b6290ddf5aa59f779c5ed';

  // ── State ─────────────────────────────────────────────────────────────────
  let rows = [], changes = [], editIdx = null, editCol = null, saving = false, isAdmin = false;
  let cfg = { key:'', binId: PUBLIC_BIN_ID, pageUrl:'', recipients:[] };
  let calYear = new Date().getFullYear(), calMonth = new Date().getMonth();
  let calTargetInput = null;

  // ── Persist ───────────────────────────────────────────────────────────────
  function persist() {
    try { localStorage.setItem('bc_v5', JSON.stringify({ key: cfg.key, binId:cfg.binId, pageUrl:cfg.pageUrl, recipients:cfg.recipients })); } catch(e){}
  }
  function loadPersisted() {
    try {
      const s = JSON.parse(localStorage.getItem('bc_v5') || '{}');
      cfg.key = s.key || '';
      cfg.binId = s.binId || PUBLIC_BIN_ID;
      cfg.pageUrl = s.pageUrl || '';
      cfg.recipients = s.recipients || [];
    } catch(e){}
  }

  // ── Admin toggle ──────────────────────────────────────────────────────────
  function toggleAdmin() {
    isAdmin = !isAdmin;
    document.getElementById('admin-badge').style.display = isAdmin ? '' : 'none';
    document.getElementById('admin-toggle').textContent = isAdmin ? 'Exit admin' : 'Admin';
    ['cfg-btn','add-btn','save-btn'].forEach(id => document.getElementById(id).style.display = isAdmin ? '' : 'none');
    document.getElementById('actions-th').style.display = isAdmin ? '' : 'none';
    document.getElementById('actions-col').style.display = isAdmin ? '' : 'none';
    if (!isAdmin) { cancelAdd(); editIdx = null; editCol = null; }
    render();
  }

  // ── Config ────────────────────────────────────────────────────────────────
  function openConfig() {
    document.getElementById('cfg-key').value = cfg.key || '';
    document.getElementById('cfg-binid').value = cfg.binId || '';
    document.getElementById('cfg-pageurl').value = cfg.pageUrl || window.location.href;
    renderChips();
    document.getElementById('cfg-panel').style.display = 'block';
  }
  function saveConfig() {
    cfg.key     = document.getElementById('cfg-key').value.trim();
    cfg.binId   = document.getElementById('cfg-binid').value.trim() || PUBLIC_BIN_ID;
    cfg.pageUrl = document.getElementById('cfg-pageurl').value.trim() || window.location.href;
    persist();
    document.getElementById('cfg-panel').style.display = 'none';
    showToast('Configuration saved');
    if (cfg.binId && cfg.key) loadBin();
  }
  function handleRecipKey(e) {
    if (e.key === 'Enter') {
      const v = e.target.value.trim();
      if (v && v.includes('@') && !cfg.recipients.includes(v)) { cfg.recipients.push(v); e.target.value = ''; renderChips(); persist(); }
    }
  }
  function removeRecip(i) { cfg.recipients.splice(i,1); renderChips(); persist(); }
  function renderChips() {
    document.getElementById('recip-wrap').innerHTML = cfg.recipients.map((r,i) =>
      `<span class="chip" onclick="removeRecip(${i})">${esc(r)} <i class="ti ti-x" style="font-size:11px"></i></span>`).join('');
  }

  // ── Status / Toast ────────────────────────────────────────────────────────
  function setStatus(s, t) {
    document.getElementById('sdot').className = 'dot dot-'+(s==='ok'?'ok':s==='busy'?'busy':'err');
    document.getElementById('stxt').textContent = t;
  }
  let toastT = null;
  function showToast(m, d=3500) {
    const el = document.getElementById('toast'); el.textContent = m; el.style.display='block';
    clearTimeout(toastT); toastT = setTimeout(()=>el.style.display='none', d);
  }
  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // ── Render ────────────────────────────────────────────────────────────────
  function render() {
    const tb = document.getElementById('tbody');
    if (!rows.length) {
      tb.innerHTML = `<tr><td colspan="${isAdmin?5:4}" style="text-align:center;color:#aaa;padding:28px">No upcoming meetings scheduled${isAdmin?' — click Add row':''}</td></tr>`;
      return;
    }
    const cols = ['date','host','book','leader'];
    tb.innerHTML = rows.map((r,i) => {
      const isEditing = editIdx === i;
      const cells = cols.map(c => {
        const editingThisCell = isEditing && editCol === c;
        if (editingThisCell) {
          if (c === 'date') {
            return `<td><div class="cal-anchor">
              <input type="text" id="ei-date-${i}" value="${esc(r.date)}" readonly
                onclick="openCal('ei-date-cal-${i}', this)"
                style="width:100%;border:0.5px solid #93c5fd;border-radius:6px;padding:4px 8px;font-size:13px;background:#fff" />
              <div class="cal-popup" id="ei-date-cal-${i}"></div>
            </div></td>`;
          }
          return `<td><input type="text" id="ei-${c}-${i}" value="${esc(r[c])}" onkeydown="if(event.key==='Enter')doneEdit(${i})" /></td>`;
        }
        // Viewer cell — click to edit if admin
        const clickAttr = isAdmin ? `onclick="startEdit(${i},'${c}')" style="cursor:pointer" title="Click to edit"` : '';
        return `<td><div class="cell-display" ${clickAttr}>${esc(r[c])}</div></td>`;
      }).join('');
      const acts = isAdmin ? `<td>
        ${isEditing
          ? `<button class="btn btn-success" onclick="doneEdit(${i})" style="padding:3px 9px;font-size:12px"><i class="ti ti-check"></i>Done</button>`
          : `<button class="btn btn-danger" onclick="deleteRow(${i})" style="padding:3px 8px;font-size:12px" aria-label="Delete"><i class="ti ti-trash"></i></button>`
        }
      </td>` : '';
      return `<tr class="${isEditing?'editing-row':''}">${cells}${acts}</tr>`;
    }).join('');
  }

  // ── Add row ───────────────────────────────────────────────────────────────
  function showAdd() { document.getElementById('add-section').style.display='block'; }
  function cancelAdd() {
    document.getElementById('add-section').style.display='none'; closeCal();
    ['date','host','book','leader'].forEach(f => { const el=document.getElementById('new-'+f); if(el) el.value=''; });
  }
  function addRow() {
    const date = document.getElementById('new-date').value.trim();
    if (!date) { showToast('Please pick a date'); return; }
    const host   = document.getElementById('new-host').value.trim();
    const book   = document.getElementById('new-book').value.trim();
    const leader = document.getElementById('new-leader').value.trim();
    rows.push({date, host, book, leader});
    changes.push(`Added new row for ${date}`);
    cancelAdd(); render();
  }

  // ── Edit cell ─────────────────────────────────────────────────────────────
  function startEdit(i, col) {
    editIdx = i; editCol = col;
    calYear = new Date().getFullYear(); calMonth = new Date().getMonth();
    render();
    // Focus the input after render
    const el = document.getElementById(col === 'date' ? `ei-date-${i}` : `ei-${col}-${i}`);
    if (el) { el.focus(); el.select && el.select(); }
  }

  function doneEdit(i) {
    if (editCol === 'date') {
      const el = document.getElementById(`ei-date-${i}`);
      if (el) {
        const nv = el.value.trim();
        if (nv && nv !== rows[i].date) {
          changes.push(`Date changed to "${nv}" for row previously on ${rows[i].date}`);
          rows[i].date = nv;
        }
      }
    } else if (editCol) {
      const el = document.getElementById(`ei-${editCol}-${i}`);
      if (el) {
        const nv = el.value.trim();
        const label = editCol.charAt(0).toUpperCase() + editCol.slice(1);
        if (nv !== rows[i][editCol]) {
          changes.push(`${label} updated to "${nv}" for ${rows[i].date}`);
          rows[i][editCol] = nv;
        }
      }
    }
    editIdx = null; editCol = null; render();
  }

  // ── Delete row ────────────────────────────────────────────────────────────
  function deleteRow(i) {
    if (!confirm(`Delete the row for "${rows[i].date}"?`)) return;
    changes.push(`Removed meeting on ${rows[i].date}`);
    rows.splice(i,1); if (editIdx===i){editIdx=null;editCol=null;} render();
  }

  // ── JSONBin ───────────────────────────────────────────────────────────────
  async function loadBin() {
    setStatus('busy','Loading…');
    // Use public access URL — no API key needed for reading
    const url = cfg.key
      ? `https://api.jsonbin.io/v3/b/${cfg.binId}/latest`
      : `https://api.jsonbin.io/v3/b/${PUBLIC_BIN_ID}/latest`;
    const headers = cfg.key ? {'X-Master-Key': cfg.key} : {'X-Access-Key': ''};
    try {
      const res = await fetch(url, cfg.key ? {headers:{'X-Master-Key':cfg.key}} : {headers:{'X-Bin-Meta':'false'}});
      if (!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      rows = data.record.rows || [];
      const upd = data.record.updatedAt
        ? new Date(data.record.updatedAt).toLocaleString('en-CA',{dateStyle:'medium',timeStyle:'short'})
        : null;
      document.getElementById('updated-label').textContent = upd ? 'Last updated: '+upd : '';
      const msg = rows.length + ' meeting'+(rows.length!==1?'s':'')+' scheduled';
      document.getElementById('meta').textContent = msg;
      setStatus('ok', msg);
    } catch(e) {
      setStatus('err','Could not load schedule');
      document.getElementById('meta').textContent = '';
    }
    render();
  }

  async function saveBin() {
    const payload = JSON.stringify({rows, updatedAt: new Date().toISOString()});
    if (!cfg.binId) {
      const res = await fetch('https://api.jsonbin.io/v3/b', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Master-Key':cfg.key,'X-Bin-Name':'book-club','X-Bin-Private':'false'},
        body: payload
      });
      if (!res.ok) throw new Error('Create failed: HTTP '+res.status);
      const data = await res.json();
      cfg.binId = data.metadata.id;
      persist();
    } else {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${cfg.binId}`, {
        method:'PUT',
        headers:{'Content-Type':'application/json','X-Master-Key':cfg.key},
        body: payload
      });
      if (!res.ok) throw new Error('Update failed: HTTP '+res.status);
    }
  }

  // ── Email ─────────────────────────────────────────────────────────────────
  function buildTableText() {
    const pad = (s,w) => String(s||'').padEnd(w).slice(0,w);
    const header  = ['Date','Host','Book','Leader'].map((h,i)=>pad(h,[14,14,28,14][i])).join('  ');
    const divider = '-'.repeat(74);
    const body    = rows.map(r=>[r.date,r.host,r.book,r.leader].map((v,i)=>pad(v||'',[14,14,28,14][i])).join('  ')).join('\n');
    return [header, divider, body].join('\n');
  }

  async function sendEmails(dateStr, cl) {
    const subject     = `Book Club Schedule Update : ${dateStr}`;
    const changeText  = cl.map(c=>'• '+c).join('\n');
    const pageLink    = cfg.pageUrl ? `\nView the schedule: ${cfg.pageUrl}` : '';
    const message     = `Changes:\n${changeText}\n\nCurrent schedule:\n\n${buildTableText()}${pageLink}\n\n— Book Club Schedule`;
    let allOk = true;
    for (const recipient of cfg.recipients) {
      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { to_email:recipient, subject, message });
      } catch(e) { console.error('EmailJS error for '+recipient, e); allOk = false; }
    }
    return allOk;
  }

  // ── Save & Notify ─────────────────────────────────────────────────────────
  async function saveAndNotify() {
    if (saving) return;
    if (!cfg.key) { showToast('Please open Configure and enter your JSONBin API key'); openConfig(); return; }
    saving = true; document.getElementById('save-btn').disabled = true;
    const dateStr = new Date().toLocaleString('en-CA',{dateStyle:'medium',timeStyle:'short'});
    const cl = changes.length ? [...changes] : ['Schedule updated'];
    setStatus('busy','Saving…');
    try {
      await saveBin(); changes = [];
      document.getElementById('updated-label').textContent = 'Last updated: '+dateStr;
      setStatus('ok','Saved ✓');
    } catch(e) {
      setStatus('err','Save failed: '+e.message);
      showToast('Save failed: '+e.message, 5000);
      saving=false; document.getElementById('save-btn').disabled=false; return;
    }
    if (cfg.recipients.length) {
      setStatus('busy','Sending emails…');
      const ok = await sendEmails(dateStr, cl);
      if (ok) { setStatus('ok',`Saved & emailed ${cfg.recipients.length} recipient(s) ✓`); showToast(`Saved & notified ${cfg.recipients.length} recipient(s) ✓`,4000); }
      else    { setStatus('err','Saved, some emails failed'); showToast('Saved. Some emails may not have delivered.',5000); }
    } else {
      showToast('Saved! Add recipients in Configure to enable email notifications.');
    }
    saving=false; document.getElementById('save-btn').disabled=false;
  }

  // ── Download for printing ─────────────────────────────────────────────────
  function downloadForPrinting() {
    const today = new Date().toLocaleDateString('en-CA');
    const trs = rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.host)}</td><td>${esc(r.book)}</td><td>${esc(r.leader)}</td></tr>`).join('');
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Book Club Schedule</title><style>body{font-family:Georgia,serif;padding:2rem;max-width:680px;margin:0 auto}h1{font-size:22px;margin-bottom:4px}.sub{color:#666;font-size:13px;margin-bottom:1.5rem}table{width:100%;border-collapse:collapse;font-size:14px}th{background:#f4f4f2;padding:10px 12px;text-align:left;border:1px solid #ddd;font-weight:600}td{padding:9px 12px;border:1px solid #ddd}tr:nth-child(even) td{background:#fafaf8}@media print{body{padding:0}}</style></head><body><h1>Book Club Schedule</h1><p class="sub">Downloaded ${today}</p><table><thead><tr><th>Date</th><th>Host</th><th>Book</th><th>Leader</th></tr></thead><tbody>${trs}</tbody></table></body></html>`;
    const a = document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'})); a.download=`book-club-schedule-${today}.html`; a.click();
  }

  // ── Calendar (fixed-position portal) ─────────────────────────────────────
  let calInputRef = null;

  function openCal(popupId, inputEl) {
    // Use the portal for fixed positioning to avoid overlap
    const portal = document.getElementById('cal-portal');
    calInputRef = inputEl;

    // Position portal below the input
    const rect = inputEl.getBoundingClientRect();
    const spaceBelow = window.innerHeight - rect.bottom;
    portal.style.left = rect.left + 'px';
    portal.style.width = '224px';
    if (spaceBelow >= 250) {
      portal.style.top  = (rect.bottom + window.scrollY + 4) + 'px';
      portal.style.bottom = 'auto';
    } else {
      portal.style.top  = 'auto';
      portal.style.bottom = (window.innerHeight - rect.top + window.scrollY + 4) + 'px';
    }

    portal._targetId = popupId; // remember which input this is for
    buildCalInPortal(inputEl);
    portal.classList.add('open');
  }

  function closeCal() {
    document.getElementById('cal-portal').classList.remove('open');
    calInputRef = null;
  }

  function buildCalInPortal(inp) {
    const portal = document.getElementById('cal-portal');
    const MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DW = ['Su','Mo','Tu','We','Th','Fr','Sa'];
    const first = new Date(calYear, calMonth, 1).getDay();
    const days  = new Date(calYear, calMonth+1, 0).getDate();
    const today = new Date();
    let sel = null;
    if (inp && inp.value) { const d = new Date(inp.value); if (!isNaN(d)) sel={y:d.getFullYear(),m:d.getMonth(),d:d.getDate()}; }
    let cells = '';
    for (let i=0;i<first;i++) cells+=`<div class="cal-day empty"></div>`;
    for (let d=1;d<=days;d++) {
      const isT = d===today.getDate()&&calMonth===today.getMonth()&&calYear===today.getFullYear();
      const isS = sel&&d===sel.d&&calMonth===sel.m&&calYear===sel.y;
      cells += `<div class="cal-day${isT?' is-today':''}${isS?' is-selected':''}" onclick="pickDate(${calYear},${calMonth},${d})">${d}</div>`;
    }
    portal.innerHTML = `<div class="cal-header">
      <button class="cal-nav" onclick="navCal(event,-1)">&#8249;</button>
      <span>${MN[calMonth]} ${calYear}</span>
      <button class="cal-nav" onclick="navCal(event,1)">&#8250;</button>
    </div>
    <div class="cal-grid">${DW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
  }

  function navCal(e, dir) {
    e.stopPropagation();
    calMonth += dir;
    if (calMonth>11){calMonth=0;calYear++;} if (calMonth<0){calMonth=11;calYear--;}
    buildCalInPortal(calInputRef);
  }

  function pickDate(year, month, day) {
    const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    if (calInputRef) calInputRef.value = `${MN[month]} ${day}, ${year}`;
    closeCal();
  }

  document.addEventListener('click', e => {
    const portal = document.getElementById('cal-portal');
    if (portal.classList.contains('open') && !e.target.closest('.cal-anchor') && !e.target.closest('#cal-portal')) {
      closeCal();
    }
  });

  // ── Init ──────────────────────────────────────────────────────────────────
  loadPersisted();
  // Always load from JSONBin on page open using the hardcoded public bin ID
  loadBin();
</script>
